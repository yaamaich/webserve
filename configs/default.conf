# WebServ HTTP Configuration File

server {
    listen 127.0.0.1:8080;
    server_name localhost www.example.com;
    client_max_body_size 10485760; # 10 MB in bytes

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Static website root
    location / {
        root ./www;
        index index.html;
        allow_methods GET;
        autoindex off;
    }

    # Uploads endpoint
    location /upload {
        root ./www/uploads;
        allow_methods POST GET DELETE;
        upload_store ./www/uploads;
        autoindex on;
    }

    # Dynamic execution (CGI scripts)
    location /cgi-bin {
        root ./www/cgi-bin;
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
    }

    # HTTP Redirection
    location /old-page {
        return /index.html;
    }
}

# Second virtual host on another port
server {
    listen 8081; # Defaults to host 0.0.0.0
    server_name static.local;
    client_max_body_size 2097152; # 2 MB

    error_page 403 /errors/403.html;

    location / {
        root ./www/static;
        index default.html;
        allow_methods GET;
        autoindex on;
    }
}